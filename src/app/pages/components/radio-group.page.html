<ui-page-header
  title="Radio Group"
  description="Pilihan tunggal dengan layout kartu dan integrasi reactive form."
>
  <button uiButton variant="outline" routerLink="/components">
    <ui-icon name="arrow-left" class="size-4" />
    Katalog komponen
  </button>
</ui-page-header>

<div class="mt-6 grid grid-cols-1 items-start gap-4">
  <div uiCard>
    <div uiCardHeader>
      <h2 uiCardTitle>Basic</h2>
      <p uiCardDescription>Radio native dengan label yang jelas.</p>
    </div>
    <div uiCardContent class="space-y-3">
      <div class="flex flex-wrap gap-x-6 gap-y-3">
        <label class="flex cursor-pointer items-center gap-2.5 text-sm">
          <input type="radio" name="basic-plan" class="size-4 accent-primary" checked />
          Bulanan
        </label>
        <label class="flex cursor-pointer items-center gap-2.5 text-sm">
          <input type="radio" name="basic-plan" class="size-4 accent-primary" />
          Tahunan
        </label>
        <label class="flex cursor-not-allowed items-center gap-2.5 text-sm opacity-50">
          <input type="radio" name="basic-plan" class="size-4 accent-primary" disabled />
          Lifetime (segera)
        </label>
      </div>
    </div>
  </div>

  <div uiCard>
    <div uiCardHeader>
      <h2 uiCardTitle>Card layout</h2>
      <p uiCardDescription>Seluruh kartu menjadi label; border dan latar berubah saat dipilih.</p>
    </div>
    <div uiCardContent>
      <div class="grid grid-cols-1 gap-3 md:grid-cols-3">
        <label
          class="flex cursor-pointer flex-col gap-2 rounded-xl border border-border p-4 transition-colors hover:bg-muted/40 has-[:checked]:border-primary has-[:checked]:bg-primary-soft/40"
        >
          <span class="flex items-center justify-between gap-2">
            <span class="text-sm font-semibold">Starter</span>
            <input type="radio" name="card-plan" class="size-4 accent-primary" checked />
          </span>
          <span class="text-xs leading-relaxed text-muted-foreground">
            3 anggota, 100 produk, laporan dasar.
          </span>
          <span class="mt-1 font-display text-lg font-bold"
            >Rp 99rb<span class="text-xs font-normal text-muted-foreground">/bln</span></span
          >
        </label>

        <label
          class="flex cursor-pointer flex-col gap-2 rounded-xl border border-border p-4 transition-colors hover:bg-muted/40 has-[:checked]:border-primary has-[:checked]:bg-primary-soft/40"
        >
          <span class="flex items-center justify-between gap-2">
            <span class="text-sm font-semibold">Pro</span>
            <input type="radio" name="card-plan" class="size-4 accent-primary" />
          </span>
          <span class="text-xs leading-relaxed text-muted-foreground">
            Anggota tak terbatas dan analitik lanjutan.
          </span>
          <span class="mt-1 font-display text-lg font-bold"
            >Rp 249rb<span class="text-xs font-normal text-muted-foreground">/bln</span></span
          >
        </label>

        <label
          class="flex cursor-pointer flex-col gap-2 rounded-xl border border-border p-4 transition-colors hover:bg-muted/40 has-[:checked]:border-primary has-[:checked]:bg-primary-soft/40"
        >
          <span class="flex items-center justify-between gap-2">
            <span class="text-sm font-semibold">Enterprise</span>
            <input type="radio" name="card-plan" class="size-4 accent-primary" />
          </span>
          <span class="text-xs leading-relaxed text-muted-foreground">
            SLA khusus, onboarding, dan dukungan prioritas.
          </span>
          <span class="mt-1 font-display text-lg font-bold">Custom</span>
        </label>
      </div>
    </div>
  </div>

  <div uiCard>
    <div uiCardHeader>
      <h2 uiCardTitle>Form</h2>
      <p uiCardDescription>Radio group dengan validasi required.</p>
    </div>
    <div uiCardContent>
      <form [formGroup]="form" (ngSubmit)="submit()" class="max-w-lg space-y-4" novalidate>
        <div class="space-y-2">
          <p class="text-sm font-medium">Paket langganan</p>
          <div class="flex flex-wrap gap-x-6 gap-y-3">
            <label class="flex cursor-pointer items-center gap-2.5 text-sm">
              <input
                type="radio"
                value="starter"
                formControlName="plan"
                class="size-4 accent-primary"
              />
              Starter
            </label>
            <label class="flex cursor-pointer items-center gap-2.5 text-sm">
              <input
                type="radio"
                value="pro"
                formControlName="plan"
                class="size-4 accent-primary"
              />
              Pro
            </label>
            <label class="flex cursor-pointer items-center gap-2.5 text-sm">
              <input
                type="radio"
                value="enterprise"
                formControlName="plan"
                class="size-4 accent-primary"
              />
              Enterprise
            </label>
          </div>
          @if (form.controls.plan.invalid && (form.controls.plan.touched || submitted())) {
            <p class="ui-error">
              <ui-icon name="circle-help" class="size-3" />
              Pilih salah satu paket.
            </p>
          }
        </div>
        <button uiButton type="submit">Simpan</button>
      </form>
    </div>
  </div>
</div>
