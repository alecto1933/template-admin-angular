<div
  id="main"
  class="grid min-h-dvh bg-background xl:h-dvh xl:grid-cols-[7fr_3fr] xl:overflow-hidden"
>
  <div class="relative flex min-h-dvh min-w-0 flex-col xl:min-h-0 xl:order-2 xl:overflow-y-auto">
    <header
      class="absolute inset-x-0 top-0 z-10 flex items-center justify-between gap-3 px-5 py-5 sm:px-8 xl:px-4 xl:py-4"
    >
      <button
        type="button"
        class="grid size-9 place-items-center rounded-lg border border-border bg-card transition-colors outline-none hover:bg-accent focus-visible:border-primary"
        [cdkMenuTriggerFor]="languageMenu"
        [attr.aria-label]="lang() === 'id' ? 'Bahasa: Indonesia' : 'Language: English'"
      >
        <img
          [src]="'/images/flags/' + lang() + '.svg'"
          alt=""
          class="h-4 w-6 rounded-[2px] object-cover ring-1 ring-black/5"
        />
      </button>

      <ng-template #languageMenu>
        <div cdkMenu class="ui-menu-panel w-44">
          <button cdkMenuItem type="button" class="ui-menu-item" (click)="setLang('id')">
            <img
              src="/images/flags/id.svg"
              alt=""
              class="h-3.5 w-5 rounded-[2px] object-cover ring-1 ring-black/5"
            />
            Indonesia
            @if (lang() === 'id') {
              <ui-icon name="check" class="ml-auto size-4 text-primary" />
            }
          </button>
          <button cdkMenuItem type="button" class="ui-menu-item" (click)="setLang('en')">
            <img
              src="/images/flags/en.svg"
              alt=""
              class="h-3.5 w-5 rounded-[2px] object-cover ring-1 ring-black/5"
            />
            English
            @if (lang() === 'en') {
              <ui-icon name="check" class="ml-auto size-4 text-primary" />
            }
          </button>
        </div>
      </ng-template>

      <button
        type="button"
        class="grid size-10 place-items-center rounded-xl text-muted-foreground transition-colors hover:bg-accent hover:text-accent-foreground"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.isDark() ? t().themeLight : t().themeDark"
      >
        <ui-icon [name]="theme.isDark() ? 'sun' : 'moon'" class="size-[18px]" />
      </button>
    </header>

    <div class="flex flex-1 px-5 py-8 sm:px-8 xl:px-4 xl:py-6">
      <div class="m-auto w-full max-w-sm">
        <div class="space-y-3 text-center">
          <img
            src="/images/logo-otsuka.webp"
            alt="Otsuka"
            width="512"
            height="256"
            class="mx-auto h-30 w-auto"
          />
          <h1 class="font-display text-[22px] leading-tight font-bold tracking-tight">
            {{ t().title }}
          </h1>
          <p class="text-sm leading-relaxed text-muted-foreground">
            {{ t().subtitle }}
          </p>
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()" class="mt-8 space-y-4 xl:mt-6" novalidate>
          <div class="space-y-1.5">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <label uiLabel for="login-username">{{ t().usernameLabel }}</label>
              <button
                uiButton
                variant="link"
                size="sm"
                type="button"
                class="h-auto text-xs font-medium text-primary"
                (click)="forgotUsername()"
              >
                {{ t().forgotUsername }}
              </button>
            </div>
            <div class="relative">
              <ui-icon
                name="user"
                class="pointer-events-none absolute top-1/2 left-3 size-4 -translate-y-1/2 text-muted-foreground"
              />
              <input
                uiInput
                id="login-username"
                type="text"
                formControlName="username"
                autocomplete="username"
                placeholder="username"
                class="pl-9"
                [attr.aria-invalid]="invalid('username') ? 'true' : null"
              />
            </div>
            @if (invalid('username')) {
              <p class="ui-error">
                <ui-icon name="circle-help" class="size-3" />
                {{ t().usernameRequired }}
              </p>
            }
          </div>

          <div class="space-y-1.5">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <label uiLabel for="login-password">{{ t().passwordLabel }}</label>
              <button
                uiButton
                variant="link"
                size="sm"
                type="button"
                class="h-auto text-xs font-medium text-primary"
                (click)="forgotPassword()"
              >
                {{ t().forgotPassword }}
              </button>
            </div>
            <div class="relative">
              <ui-icon
                name="lock"
                class="pointer-events-none absolute top-1/2 left-3 size-4 -translate-y-1/2 text-muted-foreground"
              />
              <input
                uiInput
                id="login-password"
                [type]="showPassword() ? 'text' : 'password'"
                formControlName="password"
                autocomplete="current-password"
                placeholder="••••••••"
                class="pr-10 pl-9"
                [attr.aria-invalid]="invalid('password') ? 'true' : null"
              />
              <button
                type="button"
                class="absolute top-1/2 right-2 grid size-7 -translate-y-1/2 place-items-center rounded-md text-muted-foreground transition-colors hover:bg-accent hover:text-foreground"
                (click)="togglePassword()"
                [attr.aria-label]="
                  showPassword() ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi'
                "
              >
                <ui-icon [name]="showPassword() ? 'eye-off' : 'eye'" class="size-4" />
              </button>
            </div>
            @if (invalid('password')) {
              <p class="ui-error">
                <ui-icon name="circle-help" class="size-3" />
                {{ t().passwordMin }}
              </p>
            }
          </div>

          <button uiButton type="submit" size="lg" class="mt-2 w-full" [loading]="loading()">
            {{ loading() ? t().submitting : t().submit }}
            @if (!loading()) {
              <ui-icon name="arrow-right" class="size-4" />
            }
          </button>
        </form>

        <p class="mt-8 text-center text-xs text-muted-foreground xl:mt-4">
          {{ t().vendorPrompt }}
          <button
            type="button"
            class="font-semibold text-primary hover:underline"
            (click)="register()"
          >
            {{ t().register }}
          </button>
        </p>
      </div>
    </div>
  </div>

  <aside
    class="relative hidden overflow-hidden bg-[#d9ebfa] xl:order-1 xl:flex xl:items-center xl:justify-center"
  >
    <img
      src="/images/login-panel.webp"
      alt="Ilustrasi login iVendor Superapps"
      class="size-full object-contain"
      loading="eager"
    />
  </aside>
</div>
