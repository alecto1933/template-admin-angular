<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>iVendor Superapps — Template Admin Angular</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="iVendor Superapps — template admin modern dengan Angular 22, Tailwind CSS 4, dan komponen bergaya shadcn yang dibuat sendiri."
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Apply the saved theme before Angular boots to avoid a flash of light UI.
      (function () {
        try {
          var stored = localStorage.getItem('alecto-theme');
          var dark =
            stored === 'dark' ||
            (stored === null && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
